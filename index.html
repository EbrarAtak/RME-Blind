    <!DOCTYPE html>
    <html lang="nl">
    <head>
        <meta charset="UTF-8">
        <title>Love Times</title>
        <link rel="stylesheet" href="assets/styles.css">
    </head>
    <body>


        <!-- Intro -->
        <section id="intro" class="intro">
            <div class="intro-content">
                <h1 class="fade-in">Love Times</h1>
                <p class="fade-in-delay">
                    Bloemen, knuffels & liefde voor Valentijn 💕
                </p>
                <button class="start-btn" onclick="scrollToShop()">Ontdek de liefde</button>
            </div>
        </section>

        <!-- Navigatie -->
        <nav>
            <h2>💖 Love Times</h2>
            <ul>
                <button><li><a href="#bloemen">Bloemen</a></li></button>
                <button><li><a href="#knuffels">Knuffels</a></li></button>
                <button><li><a href="#valentijn">Valentijn</a></li></button>
            </ul>
        </nav>

        <!-- Shop -->
        <section class="shop" id="bloemen">
            <h2>🌹 Bloemen</h2>
            <div class="producten">
                <div class="kaart">
                    <img src="https://dailyflowers.nl/cdn/shop/collections/RedRose-1.jpg?v=1767790871" 
                    alt="">
                    <h3>Rode XXL Rozen</h3>
                    <p>€24,99</p>
                </div>
                <div class="kaart">
                    <img src="https://dailyflowers.nl/cdn/shop/files/ChicBurgundyBeauty20251223-3.jpg?v=1766501509&width=2080" alt="">
                    <h3>Roze bloemen Mix</h3>
                    <p>€19,99</p>
                </div>
            </div>
        </section>

        <section class="shop" id="knuffels">
            <h2>🧸 Knuffels</h2>
            <div class="producten">
                <div class="kaart">
                    <img src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcQ9ITZC9bsQI8qXgEW9kGOHJcgjREQ9tbYZPQo4a-yBE6N8FxBbdhKgWYFHc843uq0HIYcWB4EYvEHGySuFIgC6TBWWxgegsMVnfU4t1Zwvij0KuAGFG_C3C9AbsDVmOjHOywJwQdo-EAE&usqp=CAc" alt="">
                    <h3>Rozen Beer</h3>
                    <p>€14,99</p>
                </div>
                <div class="kaart">
                    <img src="https://mijncadeau.nl/wp-content/uploads/2020/01/Knuffelbeer-Memo-met-accessoires-hart.jpg" alt="">
                    <h3>Beer met Hartje</h3>
                    <p>€17,99</p>
                </div>
            </div>
        </section>

        <section class="shop" id="valentijn">
            <h2>💝 Valentijn Specials</h2>
            <div class="producten">
                <div class="kaart">
                    <img src="https://euroflorist.ergonode.cloud/api/multimedia/file/72e845be-2e08-46b7-8c03-bede04734b5e.jpg" alt="">
                    <h3>Bloemen + Knuffel</h3>
                    <p>€34,99</p>
                </div>
            </div>
        </section>

        <footer>
            <p>© 2026 Love Times – Made with ❤️</p>
        </footer>


    </body>

    <script>
    function scrollToShop() {
        document.getElementById("bloemen").scrollIntoView({
            behavior: "smooth"
        });
    }
    </script>
    </html>
