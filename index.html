<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Love Times</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

    <!-- Intro -->
    <section class="intro">
        <div class="intro-content">
            <h1 class="fade-in">Love Times</h1>
            <p class="fade-in-delay">
                Bloemen, knuffels & liefde voor Valentijn 💕
            </p>
            <button class="start-btn" onclick="scrollToShop()">Ontdek de liefde</button>
        </div>
    </section>

    <!-- Navigatie -->
    <nav>
        <h2>💖 Love Times</h2>
        <ul>
            <li><a href="#bloemen">Bloemen</a></li>
            <li><a href="#knuffels">Knuffels</a></li>
            <li><a href="#valentijn">Valentijn</a></li>
        </ul>
    </nav>

    <!-- Shop -->
    <section class="shop" id="bloemen">
        <h2>🌹 Bloemen</h2>
        <div class="producten">
            <div class="kaart">
                <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93" 
                alt="">
                <h3>Rode Rozen</h3>
                <p>€24,99</p>
            </div>
            <div class="kaart">
                <img src="https://images.unsplash.com/photo-1526045478516-99145907023c" alt="">
                <h3>Roze Mix</h3>
                <p>€19,99</p>
            </div>
        </div>
    </section>

    <section class="shop" id="knuffels">
        <h2>🧸 Knuffels</h2>
        <div class="producten">
            <div class="kaart">
                <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1c1" scale(0.2) alt="">
                <h3>Hartjes Beer</h3>
                <p>€14,99</p>
            </div>
            <div class="kaart">
                <img src="https://images.unsplash.com/photo-1615485925873-9e97a12a1e92" alt="">
                <h3>Liefde Beer</h3>
                <p>€17,99</p>
            </div>
        </div>
    </section>

    <section class="shop" id="valentijn">
        <h2>💝 Valentijn Specials</h2>
        <div class="producten">
            <div class="kaart">
                <img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7" alt="">
                <h3>Bloemen + Knuffel</h3>
                <p>€34,99</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 Love Times – Made with ❤️</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
